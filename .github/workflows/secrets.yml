name: secrets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history with Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location "$base/$archive" --output "$archive"
          curl --fail --silent --show-error --location "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" --output checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "$archive" gitleaks
          ./gitleaks git "$GITHUB_WORKSPACE" --redact --log-opts="--all"
